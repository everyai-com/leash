name: release

# Releases are currently built and signed locally (Developer ID + Sparkle
# private key live on the maintainer's machine). CI just verifies the build.
# This workflow is kept disabled until we wire signing secrets in.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - run: swift build -c release --arch arm64 --arch x86_64
